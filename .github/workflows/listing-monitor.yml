name: Skelbimų stebėjimas

on:
  schedule:
    # Kas valandą, 17-ą minutę (UTC).
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listing-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Įdiegimas
        run: npm ci --no-audit --no-fund

      - name: Testai
        run: npm test

      - name: Pašto patikra
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm start

      - name: Rezultatų išsaugojimas
        if: always()
        working-directory: .
        run: |
          git config user.name "listing-monitor[bot]"
          git config user.email "listing-monitor@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Pakeitimų nėra."
          else
            git commit -m "Atnaujinti skelbimai $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
